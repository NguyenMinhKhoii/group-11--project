<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Group 11</title>
    <link rel="stylesheet" href="css/modern-style.css" />
    <!-- Redux CDN for Hoạt động 6 -->
    <script src="https://unpkg.com/@reduxjs/toolkit@1.9.7/dist/redux-toolkit.umd.js"></script>
</head>
<body class="gradient-primary">
    <div class="container">
        <div class="card fade-in">
            <div class="card-header">
                <h2>🏠 Đăng nhập hệ thống</h2>
                <div class="subtitle">Chào mừng trở lại với Group 11</div>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">📧 Email</label>
                    <input type="email" class="form-input" id="email" placeholder="Nhập email của bạn" required>
                </div>
                <div class="form-group">
                    <label class="form-label">🔒 Mật khẩu</label>
                    <input type="password" class="form-input" id="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Đăng nhập</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <p style="color: #666;">Chưa có tài khoản? <a href="signup.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Đăng ký ngay</a></p>
                <p><a href="forgot-password-new.html" style="color: #667eea; text-decoration: none;">🔑 Quên mật khẩu?</a></p>
            </div>
                        
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Lưu thông tin user vào localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showToast('🎉 Chào mừng ' + data.user.name + '! Đang chuyển hướng...', 'success');
                    
                    // Chuyển hướng sau 1.5 giây
                    setTimeout(() => {
                        window.location.href = 'dashboard-desktop.html';
                    }, 1500);
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (error) {
                showToast('❌ Lỗi kết nối: ' + error.message, 'error');
            }
        });
        
        // Toast notification function
        function showToast(message, type = 'info') {
            // Remove existing toast
            const existingToast = document.querySelector('.custom-toast');
            if (existingToast) existingToast.remove();
            
            // Create toast
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerHTML = message;
            
            // Add to body
            document.body.appendChild(toast);
            
            // Show animation
            setTimeout(() => toast.classList.add('show'), 100);
            
            // Auto remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

    </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
