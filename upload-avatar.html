<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Avatar - Group 11</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .upload-zone {
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-zone:hover, .upload-zone.upload-zone-hover {
            border-color: #007bff;
            background: #e3f2fd;
        }
        
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007bff;
        }

        #currentAvatarContainer {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">📷 Upload Avatar - <span id="userName"></span></h4>
                    </div>
                    <div class="card-body">
                        <!-- Current Avatar -->
                        <div id="currentAvatarContainer" class="text-center mb-4">
                            <h6>🖼️ Avatar hiện tại</h6>
                            <img id="currentAvatar" src="https://via.placeholder.com/150?text=No+Avatar" 
                                 class="preview-image mb-3" alt="Current Avatar">
                            <p class="text-muted">Click vào ảnh để thay đổi</p>
                        </div>

                        <!-- Upload Zone -->
                        <div id="uploadZone" class="upload-zone">
                            <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
                            <h5>📁 Kéo thả file vào đây hoặc click để chọn</h5>
                            <p class="text-muted">Hỗ trợ: JPG, PNG, GIF (Max 5MB)</p>
                        </div>

                        <!-- File Input -->
                        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                        
                        <!-- Preview Section -->
                        <div id="previewSection" style="display: none;" class="mt-4">
                            <h6>🔍 Xem trước</h6>
                            <div class="text-center mb-3">
                                <img id="previewImage" class="preview-image" alt="Preview">
                            </div>
                            <div class="d-flex justify-content-center gap-2">
                                <button class="btn btn-success" onclick="uploadToCloudinary()">☁️ Upload lên Cloudinary</button>
                                <button class="btn btn-secondary" onclick="cancelUpload()">❌ Hủy</button>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div id="progressSection" style="display: none;" class="mt-4">
                            <h6>📊 Đang upload...</h6>
                            <div class="progress">
                                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>

                        <!-- Notification Area -->
                        <div id="notification" class="alert" style="display: none;"></div>


                        <!-- Navigation -->
                        <div class="text-center mt-4">
                            <button class="btn btn-outline-primary" onclick="goBack()">🏠 Về Dashboard</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="upload-avatar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
