<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Group 11</title>
  <link rel="stylesheet" href="css/modern-style.css" />
</head>
<body class="gradient-primary">
  <!-- Header -->
  <div class="dashboard-header">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1>🛡️ RBAC System</h1>
      </div>
      <div style="display: flex; gap: 15px;">
        <span class="badge badge-danger">Admin (admin)</span>
        <button class="btn btn-secondary" onclick="goBack()">Đăng xuất</button>
      </div>
    </div>
  </div>

  <div class="profile-container fade-in">
    <!-- Profile Sidebar -->
    <div class="profile-sidebar">
      <div class="profile-avatar" style="display: flex; align-items: center; justify-content: center;">
        <img id="profileAvatarImg" src="" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none;" alt="Avatar" />
        <span id="profileAvatarIcon">👤</span>
      </div>
      <h3 id="profileName">Hà Quốc Khôi</h3>
      <p id="profileEmail" style="color: #666; margin-bottom: 20px;">khoi1@gmail.com</p>
      <span id="profileRole" class="badge badge-danger">ADMIN</span>

      <div style="background: linear-gradient(135deg, #fc6c85 0%, #f093fb 100%); border-radius: 15px; padding: 20px; margin: 30px 0; color: white; text-align: center;">
        <div style="display: flex; justify-content: space-around;">
          <div>
            <div style="font-size: 24px; font-weight: bold;">30</div>
            <div style="font-size: 12px;">Thành gia</div>
          </div>
          <div>
            <div style="font-size: 24px; font-weight: bold;">127</div>
            <div style="font-size: 12px;">Hoạt động</div>
          </div>
          <div>
            <div style="font-size: 24px; font-weight: bold;">4.8</div>
            <div style="font-size: 12px;">Đánh giá</div>
          </div>
        </div>
      </div>

      <button class="btn btn-info btn-full" onclick="changeAvatar()">📷 Đổi Avatar</button>
      <button class="btn btn-success btn-full" onclick="viewDashboard()" style="margin-top: 15px;">📊 Dashboard</button>
      <button class="btn btn-warning btn-full" onclick="quickActions()" style="margin-top: 15px;">⚡ Thao tác nhanh</button>
    </div>

    <!-- Profile Main Content -->
    <div class="profile-main">
      <!-- Tabs -->
      <div style="display: flex; margin-bottom: 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 15px; padding: 5px;">
        <button class="tab-btn active" onclick="showTab('info')" style="background: white; color: #333; border: none; padding: 12px 30px; border-radius: 10px; margin-right: 5px; font-weight: 600; cursor: pointer;">ℹ️ Thông tin chi tiết</button>
        <button class="tab-btn" onclick="showTab('edit')" style="background: transparent; color: white; border: none; padding: 12px 30px; border-radius: 10px; margin-right: 5px; font-weight: 600; cursor: pointer;">✏️ Chỉnh sửa hồ sơ</button>
        <button class="tab-btn" onclick="showTab('security')" style="background: transparent; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 600; cursor: pointer;">🔒 Bảo mật & Mật khẩu</button>
      </div>

      <!-- Info Tab -->
      <div id="infoTab" class="tab-content">
        <h3>🔧 Chỉnh sửa thông tin hồ sơ</h3>
        <button class="btn btn-info" onclick="goBack()" style="margin-bottom: 30px;">← Quay lại</button>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
          <div class="form-group">
            <label class="form-label">👤 Thông tin cá nhân</label>
            <div class="form-group">
              <label class="form-label">👤 Họ và tên đầy đủ *</label>
              <input type="text" class="form-input" value="Hà Quốc Khôi" placeholder="Tên này sẽ hiển thị trên hệ thống khi trong hệ thống">
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">📞 Số điện thoại</label>
            <input type="tel" class="form-input" value="Ví dụ: 0901234567" placeholder="Số điện thoại để liên hệ khi cần thiết">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">💼 Giới thiệu bản thân</label>
          <textarea class="form-input" rows="4" placeholder="Viết vài dòng giới thiệu về bản thân, sở thích, kinh nghiệm...">Tôi là 500 ký tự</textarea>
        </div>

        <div class="form-group">
          <label class="form-label">📍 Địa chỉ</label>
          <input type="text" class="form-input" value="Ví dụ: Quận 1, TP.HCM" placeholder="Địa chỉ hiện tại của bạn">
        </div>

        <div style="display: flex; gap: 20px; margin-top: 30px;">
          <button class="btn btn-secondary">❌ Hủy bỏ</button>
          <button class="btn btn-success">✅ Lưu thay đổi</button>
        </div>
      </div>

      <!-- Edit Tab -->
      <div id="editTab" class="tab-content" style="display: none;">
        <h3>✏️ Chỉnh sửa thông tin</h3>
        <div class="form-group">
          <label class="form-label">Họ và tên</label>
          <input type="text" class="form-input" value="Hà Quốc Khôi">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" value="khoi1@gmail.com" readonly style="background: #f5f5f5;">
        </div>
        <div class="form-group">
          <label class="form-label">Số điện thoại</label>
          <input type="tel" class="form-input" placeholder="Nhập số điện thoại">
        </div>
        <button class="btn btn-success">Cập nhật thông tin</button>
      </div>

      <!-- Security Tab -->
      <div id="securityTab" class="tab-content" style="display: none;">
        <h3>🔒 Bảo mật & Mật khẩu</h3>
        <div class="form-group">
          <label class="form-label">Mật khẩu hiện tại</label>
          <input type="password" class="form-input" placeholder="Nhập mật khẩu hiện tại">
        </div>
        <div class="form-group">
          <label class="form-label">Mật khẩu mới</label>
          <input type="password" class="form-input" placeholder="Nhập mật khẩu mới">
        </div>
        <div class="form-group">
          <label class="form-label">Xác nhận mật khẩu mới</label>
          <input type="password" class="form-input" placeholder="Nhập lại mật khẩu mới">
        </div>
        <button class="btn btn-warning">Đổi mật khẩu</button>
      </div>
    </div>
  </div>

  <script>
    // Tab functionality
    function showTab(tabName) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.style.display = 'none';
      });
      
      // Remove active class from all buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.style.background = 'transparent';
        btn.style.color = 'white';
      });

      // Show selected tab
      document.getElementById(tabName + 'Tab').style.display = 'block';
      
      // Add active class to clicked button
      event.target.classList.add('active');
      event.target.style.background = 'white';
      event.target.style.color = '#333';
    }

    function changeAvatar() {
      window.location.href = 'upload-avatar.html';
    }

    function viewDashboard() {
      window.location.href = 'dashboard-desktop.html';
    }

    function quickActions() {
      alert('⚡ Thao tác nhanh - Tính năng đang phát triển');
    }

    function goBack() {
      window.history.back();
    }

    // Load user info
    function loadUserInfo() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.name || user.fullname) {
        document.getElementById('profileName').textContent = user.name || user.fullname;
      }
      if (user.email) {
        document.getElementById('profileEmail').textContent = user.email;
      }
      if (user.role) {
        document.getElementById('profileRole').textContent = user.role.toUpperCase();
        document.getElementById('profileRole').className = `badge ${getRoleClass(user.role)}`;
      }

      // --- LOGIC MỚI: HIỂN THỊ AVATAR ---
      const avatarImg = document.getElementById('profileAvatarImg');
      const avatarIcon = document.getElementById('profileAvatarIcon');
      if (user.avatar && avatarImg && avatarIcon) {
        avatarImg.src = user.avatar;
        avatarImg.style.display = 'block';
        avatarIcon.style.display = 'none';
      } else if (avatarImg && avatarIcon) {
        avatarImg.style.display = 'none';
        avatarIcon.style.display = 'block';
      }
    }

    function getRoleClass(role) {
      switch(role) {
        case 'admin': return 'badge-danger';
        case 'moderator': return 'badge-warning';
        default: return 'badge-info';
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      loadUserInfo();
    });
  </script>
</body>
</html>
