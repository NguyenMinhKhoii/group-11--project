<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - Group 11</title>
  <link rel="stylesheet" href="css/modern-style.css" />
  <style>
    /* Toast Notifications */
    .custom-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      color: white;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      transform: translateX(400px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 9999;
      max-width: 350px;
    }

    .custom-toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .custom-toast.success {
      background: linear-gradient(135deg, #4CAF50, #45a049);
    }

    .custom-toast.error {
      background: linear-gradient(135deg, #f44336, #da190b);
    }

    .custom-toast.info {
      background: linear-gradient(135deg, #2196F3, #0b7dda);
    }
  </style>
</head>
<body class="gradient-primary">
  <div class="container">
    <div class="card fade-in">
      <div class="card-header">
        <h2>🔑 Quên mật khẩu - Group 11</h2>
        <div class="subtitle">Nhập địa chỉ email của bạn, chúng tôi sẽ gửi link để đặt lại mật khẩu.</div>
      </div>

      <form id="forgotPasswordForm">
        <div class="form-group">
          <label class="form-label">📧 Email</label>
          <input type="email" class="form-input" id="email" placeholder="Nhập email của bạn" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">📤 Gửi link đặt lại</button>
      </form>

      <!-- Success Message -->
      <div id="successMessage" class="alert alert-success" style="display: none;">
        ✅ Đã gửi email reset password! Vui lòng kiểm tra hộp thư của bạn.
      </div>

      <!-- Debug Token (for development) -->
      <div id="debugToken" class="alert" style="display: none; background: #f8f9fa; border: 1px solid #ddd; color: #333; font-size: 12px; margin-top: 20px;">
        <strong>Debug token:</strong>
        <div id="tokenText" style="word-break: break-all; margin-top: 10px;"></div>
      </div>

      <div style="text-align: center; margin-top: 20px;">
        <p><a href="login.html" style="color: #667eea; text-decoration: none;">🔙 Quay lại đăng nhập</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const submitButton = e.target.querySelector('button[type="submit"]');
      
      // Disable button and show loading
      submitButton.disabled = true;
      submitButton.textContent = '⏳ Đang gửi...';
      
      try {
        const response = await fetch('http://localhost:5000/api/auth/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Show success message
          document.getElementById('successMessage').style.display = 'block';
          
          // Show debug token if available
          if (data.debugToken) {
            document.getElementById('debugToken').style.display = 'block';
            document.getElementById('tokenText').textContent = data.debugToken;
          }
          
          // Hide form
          document.getElementById('forgotPasswordForm').style.display = 'none';
          
          // Show success toast
          showToast('✅ ' + (data.message || 'Email reset password đã được gửi!'), 'success');
        } else {
          showToast('❌ ' + (data.message || 'Có lỗi xảy ra'), 'error');
        }
      } catch (error) {
        showToast('❌ Lỗi kết nối: ' + error.message, 'error');
      } finally {
        // Re-enable button
        submitButton.disabled = false;
        submitButton.textContent = '📤 Gửi link đặt lại';
      }
    });
    
    // Toast notification function
    function showToast(message, type = 'info') {
      // Remove existing toast
      const existingToast = document.querySelector('.custom-toast');
      if (existingToast) existingToast.remove();
      
      // Create toast
      const toast = document.createElement('div');
      toast.className = `custom-toast ${type}`;
      toast.innerHTML = message;
      
      // Add to body
      document.body.appendChild(toast);
      
      // Show animation
      setTimeout(() => toast.classList.add('show'), 100);
      
      // Auto remove
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
