<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản - Group 11</title>
  <link rel="stylesheet" href="css/modern-style.css" />
</head>
<body class="gradient-primary">
  <div class="container">
    <div class="card fade-in">
      <div class="card-header">
        <h2>🏠 Đăng ký tài khoản - Group 11</h2>
        <div class="subtitle">Đăng ký tài khoản để trải nghiệm hệ thống phân quyền nâng cao!</div>
      </div>
      
      <div class="alert alert-info" style="margin-bottom: 25px;">
        <strong>🔥 Hoạt động 2 - Advanced RBAC System</strong><br>
        Đăng ký tài khoản để trải nghiệm hệ thống phân quyền nâng cao!
      </div>

      <form id="signupForm">

        <div class="form-group">
          <label class="form-label">👤 Họ và tên</label>
          <input type="text" class="form-input" id="fullname" placeholder="Hà Quốc Khôi" required />
        </div>

        <div class="form-group">
          <label class="form-label">📧 Email</label>
          <input type="email" class="form-input" id="email" placeholder="khoi1@gmail.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">🔒 Mật khẩu</label>
          <input type="password" class="form-input" id="password" placeholder="••••••" required />
        </div>

        <div class="form-group">
          <label class="form-label">🎭 Role (Vai trò)</label>
          <select class="form-select" id="role" required>
            <option value="user" selected>👤 User (Người dùng)</option>
            <option value="moderator">🛡️ Moderator (Quản trị viên)</option>
            <option value="admin">👑 Admin (Quản lý cao nhất)</option>
          </select>
          <small style="color: #666; font-size: 12px;">Chọn role để test các tính năng RBAC khác nhau</small>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Đăng ký</button>
        
        <div style="text-align: center; margin-top: 20px;">
          <p style="color: #666;">Đã có tài khoản? <a href="login.html" style="color: #667eea; text-decoration: none; font-weight: 600;">Đăng nhập ngay</a></p>
        </div>
        
        <!-- Thông báo kết quả -->

      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullname = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      try {
        const res = await fetch("http://localhost:5000/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: fullname, email, password, role }),
        });

        const data = await res.json();
        
        if (data.success) {
          showToast(`🎉 Đăng ký thành công với role ${role.toUpperCase()}! Đang chuyển hướng...`, 'success');
          
          // Tự động chuyển đến trang đăng nhập sau 2 giây
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        } else {
          showToast(data.message || "❌ Đăng ký thất bại!", 'error');
        }

      } catch (err) {
        showToast("⚠️ Lỗi kết nối tới server!", 'error');
      }
    });
    
    // Toast notification function
    function showToast(message, type = 'info') {
        // Remove existing toast
        const existingToast = document.querySelector('.custom-toast');
        if (existingToast) existingToast.remove();
        
        // Create toast
        const toast = document.createElement('div');
        toast.className = `custom-toast ${type}`;
        toast.innerHTML = message;
        
        // Add to body
        document.body.appendChild(toast);
        
        // Show animation
        setTimeout(() => toast.classList.add('show'), 100);
        
        // Auto remove
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
